name: "Verify and Publish Paper"
run-name: "📄 Verify the paper and publish the artifact of record"

# Not a required check, so it may filter: it only has something to say
# when the paper or what the paper reads has changed. Guarding the branch
# is verify_record.yml's job, which runs on every push unfiltered.
on:
  push:
    paths:
      - ".research/latex/**"
      - ".research/record.json"
      - ".research/results/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Self-contained: `airas verify-paper` re-runs every record check before
  # the paper's own, and deletes the PDF when any of them fails, so a PDF
  # is never published on a record that did not verify — without needing
  # to depend on the record workflow's run.
  build-paper:
    name: Verify paper values, build PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the provenance check requires the declared run's
          # commit to be an ancestor of HEAD, which a shallow clone cannot
          # answer.
          fetch-depth: 0

      - name: Look for a paper
        id: paper
        run: |
          if compgen -G ".research/latex/*/main.tex" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No .research/latex/*/main.tex — nothing to build yet."
          fi

      - name: Install LaTeX toolchain
        if: steps.paper.outputs.present == 'true'
        uses: Wandalen/wretry.action@v3
        with:
          attempt_limit: 3
          attempt_delay: 30000
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              texlive-base \
              texlive-latex-recommended \
              texlive-fonts-recommended \
              texlive-latex-extra \
              texlive-science \
              texlive-luatex \
              texlive-lang-japanese

      - name: Install uv
        if: steps.paper.outputs.present == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Verify paper values and provenance, build PDF
        if: steps.paper.outputs.present == 'true'
        env:
          SEYVAL_API_KEY: ${{ secrets.SEYVAL_API_KEY }}
        run: |
          uvx --from "airas @ git+https://github.com/airas-org/airas.git@main#subdirectory=backend" \
            airas verify-paper --local-path . --output-dir paper-artifact

      # Always uploaded, but the gate deletes the PDF when verification
      # fails, so a red run publishes the report alone — the PDF exists only
      # for a paper that passed.
      - name: Upload verification report and PDF
        if: always() && steps.paper.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verified-paper-${{ github.sha }}
          path: paper-artifact/
          if-no-files-found: ignore
