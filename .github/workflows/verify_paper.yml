# The paper integrity gate.
#
# Re-runs, against this exact commit, the same verification `verify_latex`
# runs locally — recompute every declared value from the run outputs, diff
# values.tex against a regeneration, require every \airasval key to be
# defined, and cross-check the local metrics files against the Seyval run
# declared in .research/results/.provenance.json — and then builds the PDF
# from the same checked-out tree.
#
# Verification and compilation are one job on purpose: the artifact of a
# green run is the only PDF that provably came from a state that passed,
# so "the paper" can be defined as "the artifact of a green run of this
# workflow", referenced by commit SHA. A local "it passed" is the agent's
# own claim; this run is not.
#
# Unlike compile_latex.yml (an agent-driven fix loop), this workflow is
# deterministic, runs no agent, and never pushes: contents permission is
# read-only.
name: "Verify Paper"
run-name: "🔎 Verify paper integrity and build PDF"

on:
  push:
    paths:
      - ".research/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify-and-build:
    name: Verify values and provenance, build PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the provenance check requires the declared run's
          # commit to be an ancestor of HEAD, which a shallow clone cannot
          # answer.
          fetch-depth: 0

      - name: Install LaTeX toolchain
        uses: Wandalen/wretry.action@v3
        with:
          attempt_limit: 3
          attempt_delay: 30000
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              texlive-base \
              texlive-latex-recommended \
              texlive-fonts-recommended \
              texlive-latex-extra \
              texlive-science \
              texlive-luatex \
              texlive-lang-japanese

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify paper values and provenance, build PDF
        env:
          # Read access to Seyval's per-run storage, for the provenance
          # cross-check. Without it the check reports "unavailable", which
          # this gate treats as a failure — an unverifiable paper must not
          # ship with a green check.
          SEYVAL_API_KEY: ${{ secrets.SEYVAL_API_KEY }}
        run: |
          uvx --from "airas @ git+https://github.com/airas-org/airas.git@develop#subdirectory=backend" \
            airas verify-paper --local-path . --output-dir paper-artifact

      - name: Upload verification report and PDF
        # The report is uploaded even when the gate fails, so a red run
        # still explains itself; a failed run's artifact contains no PDF.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-paper-${{ github.sha }}
          path: paper-artifact/
          if-no-files-found: ignore
