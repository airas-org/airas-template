name: "Verify Paper"
run-name: "🔎 Verify the paper"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  verify-paper:
    name: Verify the paper
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Values only, no PDF build: the build commits back onto the protected
      # branch, so it stays in the non-required publish_paper workflow. A
      # repository with no paper yet passes.
      - name: Verify paper values against the record
        env:
          SEYVAL_API_KEY: ${{ secrets.SEYVAL_API_KEY }}
          GH_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
        run: |
          # airas の commit SHA は、airas 側の CI（pin_airas_template.yml）によって自動的に書き換えられる。
          uvx --from "airas @ git+https://github.com/airas-org/airas.git@78d69ae1b91127fad4c1c64ca69dc904df7e95eb#subdirectory=backend" \
            airas verify-paper --local-path .

      # A paper.pdf commit is the Publish Paper build of its parent and nothing
      # else: the paper gate is where the paper's own files are held to the
      # record, so the PDF is held here too.

