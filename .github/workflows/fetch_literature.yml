name: "Fetch Literature"
run-name: "📚 Fetch literature: ${{ inputs.query }}"

# The only way literature enters .research/sources/: this run searches,
# fetches every result's text and the search source's metadata, and uploads
# them as an artifact; import_literature_from_artifacts commits that artifact,
# and the record gate compares .research/sources/ against it. Nothing here
# reads the repository, so what the run fetched does not depend on files the
# agent can edit.
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Search query"
        required: true
      sources:
        description: 'Comma-separated search sources, or "all"'
        default: "all"
      max_results_per_source:
        description: "Results per source"
        default: "5"
      year:
        description: 'Publication year, "2024" or "2020-2024" (empty: any)'
        default: ""
      openalex_semantic:
        description: "Embedding search on openalex (needs OPENALEX_API_KEY)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fetch-literature:
    name: Fetch the literature
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Search and fetch
        env:
          QUERY: ${{ inputs.query }}
          SOURCES: ${{ inputs.sources }}
          MAX_RESULTS_PER_SOURCE: ${{ inputs.max_results_per_source }}
          YEAR: ${{ inputs.year }}
          OPENALEX_SEMANTIC: ${{ inputs.openalex_semantic }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          set -euo pipefail
          args=(--query "$QUERY" --output-dir literature
                --sources "$SOURCES" --max-results-per-source "$MAX_RESULTS_PER_SOURCE")
          [ -n "$YEAR" ] && args+=(--year "$YEAR")
          [ "$OPENALEX_SEMANTIC" = "true" ] && args+=(--openalex-semantic)
          # airas の commit SHA は、airas 側の CI（pin_airas_template.yml）によって自動的に書き換えられる。
          uvx --from "airas @ git+https://github.com/airas-org/airas.git@fb5e4e9427545a152f412640e3bbab1b43795cda#subdirectory=backend" \
            airas fetch-literature "${args[@]}"

      - name: Upload the literature
        uses: actions/upload-artifact@v4
        with:
          # import_literature_from_artifacts and the record gate look the artifact up by this name.
          name: literature-${{ github.run_id }}
          path: literature
          if-no-files-found: error
          retention-days: 90
