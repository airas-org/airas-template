name: "Fetch Literature"
run-name: "📚 Fetch literature: ${{ inputs.query || format('arXiv {0}; DOI {1}', inputs.arxiv_ids, inputs.dois) }}"

# The checkout is only written to: no file from the repository is
# executed, so what the run fetched does not depend on files the agent can edit.
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Search query (exclusive with identifiers)"
      arxiv_ids:
        description: 'JSON array of raw arXiv IDs, e.g. ["1706.03762v7"]'
        default: "[]"
      dois:
        description: 'JSON array of raw DOIs, e.g. ["10.18653/v1/N18-3011"]'
        default: "[]"
      sources:
        description: 'Comma-separated search sources, or "all"'
        default: "arxiv,airas_records"
      max_results_per_source:
        description: "Results per source"
        default: "5"
      year:
        description: 'Publication year, "2024" or "2020-2024" (empty: any)'
        default: ""
      openalex_semantic:
        description: "Embedding search on openalex (needs OPENALEX_API_KEY)"
        type: boolean
        default: false

permissions:
  contents: write

# Two runs on one branch would number their sources from the same s<N>.
concurrency:
  group: fetch-literature-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fetch-literature:
    name: Fetch the literature
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Outside the checkout so it is never committed; `runner` is not available at job level.
      LITERATURE_DIR: /tmp/literature

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Fetch literature
        env:
          QUERY: ${{ inputs.query }}
          ARXIV_IDS: ${{ inputs.arxiv_ids }}
          DOIS: ${{ inputs.dois }}
          SOURCES: ${{ inputs.sources }}
          MAX_RESULTS_PER_SOURCE: ${{ inputs.max_results_per_source }}
          YEAR: ${{ inputs.year }}
          OPENALEX_SEMANTIC: ${{ inputs.openalex_semantic }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          set -euo pipefail
          args=(--output-dir "$LITERATURE_DIR"
                --sources "$SOURCES" --max-results-per-source "$MAX_RESULTS_PER_SOURCE")
          [ -n "$QUERY" ] && args+=(--query "$QUERY")
          [ -n "$ARXIV_IDS" ] && args+=(--arxiv-ids "$ARXIV_IDS")
          [ -n "$DOIS" ] && args+=(--dois "$DOIS")
          [ -n "$YEAR" ] && args+=(--year "$YEAR")
          [ "$OPENALEX_SEMANTIC" = "true" ] && args+=(--openalex-semantic)
          # airas の commit SHA は、airas 側の CI（pin_airas_template.yml）によって自動的に書き換えられる。
          uvx --from "airas @ git+https://github.com/airas-org/airas.git@e1c37b5600acb4d717111b7a5789a2144a184959#subdirectory=backend" \
            airas fetch-literature "${args[@]}"

      - name: Upload the literature
        uses: actions/upload-artifact@v4
        with:
          # The record gate looks the artifact up by this name.
          name: literature-${{ github.run_id }}
          path: ${{ env.LITERATURE_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Import into .research/sources/
        run: |
          # airas の commit SHA は、airas 側の CI（pin_airas_template.yml）によって自動的に書き換えられる。
          uvx --from "airas @ git+https://github.com/airas-org/airas.git@e1c37b5600acb4d717111b7a5789a2144a184959#subdirectory=backend" \
            airas import-literature-from-artifact --artifact-dir "$LITERATURE_DIR" \
              --workflow-run-id "$GITHUB_RUN_ID" --local-path .

      - name: Commit and push onto the dispatched branch
        env:
          QUERY: ${{ inputs.query }}
          ARXIV_IDS: ${{ inputs.arxiv_ids }}
          DOIS: ${{ inputs.dois }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .research/sources
          git commit -q -m "literature: import fetch_literature run $GITHUB_RUN_ID" -m "query: $QUERY" -m "arxiv_ids: $ARXIV_IDS" -m "dois: $DOIS"
          # The agent may push to the same branch meanwhile; sources/ is only ever written here.
          for attempt in 1 2 3; do
            git push -q && exit 0
            git pull -q --rebase
          done
          echo "::error::could not push onto $GITHUB_REF_NAME"
          exit 1
